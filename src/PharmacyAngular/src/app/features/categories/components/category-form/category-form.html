<form [formGroup]="form" (ngSubmit)="submit()">

    <div class="row">

        <!-- Code -->

        <div class="col-md-4 mb-3">

            <label class="form-label">

                Category Code

            </label>

            <input class="form-control" formControlName="codeCat">

            <div class="text-danger mt-1" *ngIf="
                    form.controls.codeCat.touched &&
                    form.controls.codeCat.hasError('required')">

                Category Code is required.

            </div>

            <div class="text-danger mt-1" *ngIf="
                    form.controls.codeCat.touched &&
                    form.controls.codeCat.hasError('pattern')">

                Format must be AAA999.

            </div>

        </div>

        <!-- Name -->

        <div class="col-md-8 mb-3">

            <label class="form-label">

                Category Name

            </label>

            <input class="form-control" formControlName="nameCat">

            <div class="text-danger mt-1" *ngIf="
                    form.controls.nameCat.touched &&
                    form.controls.nameCat.hasError('required')">

                Category Name is required.

            </div>

            <div class="text-danger mt-1" *ngIf="
                    form.controls.nameCat.touched &&
                    form.controls.nameCat.hasError('minlength')">

                Must contain at least 3 characters.

            </div>

        </div>

    </div>

    <div class="mt-3">

        <button class="btn btn-primary m-2" type="submit">

            {{ buttonText }}

        </button>

        <button class="btn btn-secondary" type="button" (click)="goBack()">

            Back

        </button>

    </div>

</form>
