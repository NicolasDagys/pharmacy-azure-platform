<form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Customer ID + Name -->

    <div class="row">

        <div class="col-md-4 mb-3">

            <label class="form-label">

                Customer ID

            </label>

            <input class="form-control" formControlName="idCus">

            <div class="text-danger mt-1" *ngIf="
                    form.controls.idCus.touched &&
                    form.controls.idCus.hasError('required')">

                Customer ID is required.

            </div>

            <div class="text-danger mt-1" *ngIf="
                    form.controls.idCus.touched &&
                    form.controls.idCus.hasError('pattern')">

                Format must be 123456-7 or 1234567-8.

            </div>

        </div>

        <div class="col-md-8 mb-3">

            <label class="form-label">

                Customer Name

            </label>

            <input class="form-control" formControlName="nameCus">

            <div class="text-danger mt-1" *ngIf="
                    form.controls.nameCus.touched &&
                    form.controls.nameCus.invalid">

                Enter a valid customer name.

            </div>

        </div>

    </div>

    <!-- Email + Phone -->

    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">

                Email

            </label>

            <input type="email" class="form-control" formControlName="mailCus">

            <div class="text-danger mt-1" *ngIf="
                    form.controls.mailCus.touched &&
                    form.controls.mailCus.invalid">

                Enter a valid email address.

            </div>

        </div>

        <div class="col-md-6 mb-3">

            <label class="form-label">

                Phone

            </label>

            <input type="text" class="form-control" formControlName="phoneCus">

            <div class="text-danger mt-1" *ngIf="
                    form.controls.phoneCus.touched &&
                    form.controls.phoneCus.hasError('pattern')">

                Phone must contain numbers only.

            </div>

        </div>

    </div>

    <div class="mt-3">

        <button class="btn btn-primary m-2" type="submit">

            {{buttonText}}

        </button>

        <button class="btn btn-secondary" type="button" (click)="goBack()">

            Back

        </button>

    </div>

</form>
